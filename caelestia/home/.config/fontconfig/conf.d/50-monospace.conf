<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- One monospace font everywhere: anything asking for the generic "monospace"
     (Firefox code blocks, Qt's fixed font, GTK apps) gets the terminal's font.
     Glyphs it lacks (CJK, emoji) still fall back to the Noto fonts. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
